name: Check links

on:
  schedule:
    # 01:00 UTC on the 1st of every month
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Check links
        id: links
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python scripts/check_links.py | tee link-check-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Open issue for broken links
        if: steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(date -u +%Y-%m)
          body_file=$(mktemp)
          {
            echo "The scheduled link check failed."
            echo
            echo '```'
            cat link-check-output.txt
            echo '```'
          } > "$body_file"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Broken links ${month}" \
            --body-file "$body_file"
